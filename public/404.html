<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kannada Reading App</title>
  <script>
    // GitHub Pages 404 redirect hack for single-page apps.
    // Converts the path to a query string and redirects to index.html,
    // which then restores the original path via the redirect script in index.html.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') +
      '/?p=' + encodeURIComponent(l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '')) +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
